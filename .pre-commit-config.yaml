default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # A blank context line in a quilt patch is a single space.
        exclude: ^debian/patches/

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, yaml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: ^src/
        # kasa and dbus_fast are not installed into the hook's isolated
        # environment; [[tool.mypy.overrides]] in pyproject.toml ignores
        # their missing stubs, the way make_fillable does for cv2.

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
      - id: vale
        name: vale
        # The PyPI "vale" package wraps the official binary, so pre-commit
        # installs it into the hook's own environment - nothing to install by
        # hand, locally or in CI. CLAUDE.md and .claude/ are instructions for
        # an agent, not prose for people, so they stay out of the prose check.
        entry: vale
        language: python
        additional_dependencies: ["vale==3.19.0.0"]
        types: [markdown]
        exclude: ^(CLAUDE\.md|\.claude/)
