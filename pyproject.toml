[project]
name = "camera-sign"
version = "0.1.0"
description = "Light an on-air sign, through a Kasa smart plug, while the webcam is open"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Robert August Vincent II", email = "pillarsdotnet@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "dbus-fast>=2.0",
  # Unreleased fix: EP10 firmware 1.1.x logs in with KLAP v2 (python-kasa PR 1731).
  # Return to a version range once a release after 0.10.2 includes it.
  "python-kasa @ git+https://github.com/python-kasa/python-kasa@998ebe79e825d4e1f25013037b7b33fd0569bf6b",
]

[project.scripts]
camera-sign = "camera_sign.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Enable the entire Ruff rule set; suppress only mutually-incompatible rules.
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211 — keep D211 (no blank line before class docstring)
  "D213",   # conflicts with D212 — keep D212 (summary on first line)
  "COM812", # conflicts with the ruff formatter, which owns trailing commas
  "ISC001", # conflicts with the ruff formatter, which owns implicit concatenation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D",       # test names say what they test; docstrings would repeat them
  "INP001",  # pytest finds tests by path; the directory is not a package
  "S101",    # pytest tests assert
  "PLR2004", # expected values in assertions read clearer bare
  "ANN",     # test signatures are fixtures-in, None-out
  "SLF001",  # tests reach the watcher's private reconnect task to await it
]

[tool.mypy]
# Pin the target so mypy checks the language level we actually support
# (requires-python) instead of whatever interpreter happens to run the hook.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = false
warn_unused_ignores = true

# kasa and dbus_fast are not installed into the pre-commit mypy hook's
# isolated environment, so don't fail on their missing stubs.
[[tool.mypy.overrides]]
module = ["kasa", "kasa.*", "dbus_fast", "dbus_fast.*"]
ignore_missing_imports = true
