[project]
name = "camera-sign"
version = "0.1.0"
description = "Light an on-air sign, through a Kasa smart plug, while the webcam is open"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Robert August Vincent II", email = "pillarsdotnet@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "dbus-fast>=2.0",
  "python-kasa>=0.10",
]

[project.scripts]
camera-sign = "camera_sign.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "D"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
